---
services:
    database:
        image: mysql:8.0
        container_name: database
        restart: always
        ports:
            - "3306:3306"
        environment:
            MYSQL_DATABASE: "ghost"
            MYSQL_USER: "user"
            MYSQL_ROOT_PASSWORD: "password123"
            MYSQL_PASSWORD: "password123"
        volumes:
            - db_data:/var/lib/mysql

volumes:
    db_data:
