---
services:
    nginx:
      image: nginx:latest
      container_name: nginx
      restart: always
      ports:
          - "80:80"
      volumes:
          - /home/ubuntu/nginx.conf:/etc/nginx/conf.d/default.conf:ro
          - /home/ubuntu/nginx-logs/:/var/log/nginx/

    promtail:
      image: grafana/promtail:latest
      container_name: promtail
      command: -config.file=/etc/promtail/promtail-config.yml
      volumes:
        - /home/ubuntu/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
        - /home/ubuntu/nginx-logs/:/var/log/nginx/:ro
        - /var/lib/promtail:/tmp
      restart: unless-stopped
