---
- name: Update All Machines
  hosts: all
  become: true
  gather_facts: false
  serial: 2
  tasks:
    - pause:
        seconds: 10
  
    - name: Wait For Instances to Appear Online
      delegate_to: localhost
      retries: 10
      delay: 5
      register: ssm_status
      until: "'Online' in ssm_status.stdout"
      shell: |
        aws ssm describe-instance-information \
        --filters "Key=InstanceIds,Values={{ inventory_hostname }}" \
        --query "InstanceInformationList[0].PingStatus" \
        --output text

    - name: Wait For All Instance Command Respoinse
      command: uptime
      ignore_unreachable: true
      failed_when: false
      register: result
      retries: 40
      delay: 10
      until: result is defined and result.rc is defined and result.rc == 0

    - name: Update And Upgrade Apt Packages
      apt:
        upgrade: yes
        update_cache: yes
        cache_valid_time: 86400

- name: Install Nginx Proxy
  hosts: nginx
  become: yes
  tasks:
    - name: Configure Nginx Proxy
      include_role:
        name: configure_nginx
        tasks_from: main.yml

- name: Deploy Services
  hosts: web_app, database
  become: true
  tasks:
    - name: Call Deploy Services Roles
      include_role:
        name: deploy_services
        tasks_from: main.yml

- name: Install Metrics Exporters
  hosts: web_app, database
  become: true
  tasks:
    - name: Run Install Exporters Role
      include_role:
        name: install_exporters
        tasks_from: main.yml

- name: Setup Monitoring
  hosts: monitoring
  become: true
  tasks:
    - name: Setup Monitoring Services
      include_role: 
        name: setup_monitoring
        tasks_from: main.yml
      
    - name: Check EC2 Instances
      describe_instances:
        aws_access_key_id: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
        aws_secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
        region: "eu-west-2" 
      register: instance_details
