version: "3.8"

services:
  controller:
    image: jenkins/jenkins:lts
    privileged: true
    user: root
    container_name: controller
    networks:
      - jenkins-net
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - /opt/jenkins/config:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins-agent-workdir:

networks:
  jenkins-net:
    name: jenkins-net
    driver: bridge

