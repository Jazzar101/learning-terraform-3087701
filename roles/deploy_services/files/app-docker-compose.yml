---
services:
  app:
    image: directus/directus
    container_name: app
    restart: always
    environment:
      DB_CLIENT: "mysql"
      DB_HOST: "13.40.143.149"
      DB_PORT: 3306
      DB_USER: "user"
      DB_PASSWORD: "password123"
      DB_DATABASE: "directus"

      KEY: "mykey"
      SECRET: "mysecret"

      ADMIN_EMAIL: "admin@admin.com"
      ADMIN_PASSWORD: "password123"
    volumes:
      - ./strapi-data:/srv/data
    ports:
      - "8055:8055"
 
  nginx:
      image: nginx:latest
      container_name: nginx
      restart: always
      ports:
          - "80:80"
      volumes:
          - /home/ubuntu/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      depends_on:
          - app
