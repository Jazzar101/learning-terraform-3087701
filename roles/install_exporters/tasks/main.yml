- name: Create temp download directory
  file:
    path: /tmp/node_exporter
    state: directory
    mode: '0755'

- name: Download node_exporter archive
  get_url:
    url: https://github.com/prometheus/node_exporter/releases/download/v1.6.0/node_exporter-1.6.0.linux-amd64.tar.gz
    dest: /tmp/node_exporter/node_exporter.tar.gz
    mode: '0644'

- name: Extract node_exporter
  unarchive:
    src: /tmp/node_exporter/node_exporter.tar.gz
    dest: /tmp/node_exporter
    remote_src: yes

- name: Copy node_exporter binary
  copy:
    src: /tmp/node_exporter/node_exporter-1.6.0.linux-amd64/node_exporter
    dest: /usr/local/bin/node_exporter
    mode: '0755'
    remote_src: yes

- name: Create node_exporter systemd service
  copy:
    dest: /etc/systemd/system/node_exporter.service
    content: |
      [Unit]
      Description=Node Exporter
      After=network.target

      [Service]
      User=node_exporter
      ExecStart=/usr/local/bin/node_exporter

      [Install]
      WantedBy=multi-user.target

- name: Create node_exporter user
  user:
    name: node_exporter
    shell: /usr/sbin/nologin
   
- name: Reload systemd
  systemd:
    daemon_reload: yes

- name: Enable & start node_exporter
  systemd:
    name: node_exporter
    enabled: yes
    state: started

- name: Check node_exporter endpoint
  uri:
    url: http://localhost:9100/metrics
    return_content: yes
  register: metrics_output

- debug:
    var: metrics_output.status
